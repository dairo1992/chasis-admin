<!-- src/common/layout/layout.component.html -->
<div class="flex h-screen bg-base-200 text-base-content">
  <!-- Sidebar -->
  <div class="sidebar" 
       [ngClass]="{ 'collapsed': isCollapsed && !isExpandedOnHover, 'expanded': !isCollapsed || isExpandedOnHover }"
       (mouseenter)="onMouseEnter()" 
       (mouseleave)="onMouseLeave()">
    
    <!-- Sidebar Header -->
    <div class="sidebar-header">
      <div class="flex items-center gap-3">
        <div class="icon-wrapper">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <span class="app-title" *ngIf="!isCollapsed || isExpandedOnHover">Chasis Admin</span>
      </div>
    </div>

    <!-- Dynamic Menu -->
    <div class="menu-container">
      <ul class="menu">
        <ng-container *ngFor="let menuItem of menuItems()">
          <li class="menu-item-group" *ngIf="menuItem.children && menuItem.children.length > 0; else simpleItem">
            <details [open]="isMenuItemExpanded(menuItem.label)">
              <summary class="menu-summary" (click)="toggleMenuItem(menuItem.label)">
                <div class="flex items-center gap-3">
                  <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="menuItem.icon"></path>
                  </svg>
                  <span class="menu-text" *ngIf="!isCollapsed || isExpandedOnHover">{{ menuItem.label }}</span>
                </div>
                <i class="menu-arrow" *ngIf="!isCollapsed || isExpandedOnHover"></i>
              </summary>
              <ul class="submenu" *ngIf="!isCollapsed || isExpandedOnHover">
                <li *ngFor="let subItem of menuItem.children">
                  <a [routerLink]="subItem.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="onMenuItemClick()" class="submenu-link">
                    <svg class="submenu-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="subItem.icon"></path>
                    </svg>
                    <span>{{ subItem.label }}</span>
                  </a>
                </li>
              </ul>
            </details>
          </li>
          <ng-template #simpleItem>
            <li class="menu-item">
              <a [routerLink]="menuItem.path || '/'" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="onMenuItemClick()" class="menu-link">
                <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="menuItem.icon"></path>
                </svg>
                <span class="menu-text" *ngIf="!isCollapsed || isExpandedOnHover">{{ menuItem.label }}</span>
              </a>
            </li>
          </ng-template>
        </ng-container>
      </ul>
    </div>

    <!-- Sidebar Footer -->
    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="avatar placeholder">
          <div class="bg-primary text-primary-content rounded-full w-10 h-10">
            <span class="text-sm font-bold">JD</span>
          </div>
        </div>
        <div class="user-info" *ngIf="!isCollapsed || isExpandedOnHover">
          <p class="font-semibold">John Doe</p>
          <p class="text-xs opacity-60">john.doe@example.com</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Main content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <app-header (toggleSidebar)="toggleSidebar()"></app-header>
    <div class="px-6 py-4 bg-base-100 border-b border-base-300">
      <app-breadcrumb></app-breadcrumb>
    </div>
    <main class="flex-1 overflow-y-auto bg-base-100 p-6">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Alert Component -->
  <app-alert></app-alert>
</div>
